<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Marche Regional Profile · Power BI report</title>
  <meta name="description" content="An eight-page Power BI report on the Marche region of Italy, built on Eurostat and the regional business register.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="hero">
      <p class="eyebrow">Power BI report · Marche, Italy</p>
      <h1>An eight-page Power BI profile of an Italian region, built on official statistics</h1>
      <p class="finding">The Marche are an older, smaller region with fewer firms: 26.6 % of residents are aged 65 or over, and active companies are 17.1 % fewer than in December 2009.</p>
      <div class="actions">
        <a class="button primary" href="report/marche-regional-profile.pdf">PDF</a>
        <a class="button" href="https://github.com/simones99/marche-regional-stats">Repository</a>
      </div>
      <figure class="page">
        <img src="report/01-overview.png" width="1600" height="926"
             alt="Overview page of the report. Headline: An older, smaller region with fewer firms. Six cards compare the Marche with Italy: population 1.48 million, 26.6 % aged 65 or over, 11.8 deaths per 1,000, unemployment 5.1 %, GDP per inhabitant 34 thousand euros, 131 thousand active companies. A photo shows the Valadier temple in its cave. Two line charts show the population falling from 1.55 million in 2014 to 1.48 million, and active companies falling from about 159 thousand around 2011 to 131 thousand.">
      </figure>
    </header>
  </main>

</html>
